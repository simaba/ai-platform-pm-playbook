name: Validate documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate local Markdown links
        run: python scripts/validate_relative_links.py
